<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e10">
  <meta name="robots" content="noindex,nofollow">
  <title>PEAK — каталог и пополнение</title>
  <link rel="icon" href="/mark.svg">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#grid">К товарам</a>
  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="./" aria-label="PEAK, главная">
        <svg class="brand-mark" aria-hidden="true" viewBox="0 0 64 48"><path fill="#e8322a" d="M2 44 30 2h7l19 29H44L34 16 21 35h36l6 9z"/></svg>
        <img src="/logo.png" alt="PEAK" width="70" height="24">
        <span class="brand-sub">Каталог</span>
      </a>
      <nav class="tabs" aria-label="Разделы">
        <button id="catalog-tab" type="button" aria-current="page">Каталог</button>
        <button id="orders-tab" type="button">Заявки<b id="orders-badge" class="badge" hidden></b></button>
      </nav>
      <div class="top-actions">
        <span id="sync" class="sync" role="status" hidden><i></i><span></span></span>
        <label class="location"><span id="account-name"></span><select id="demo-role" aria-label="Магазин или склад в демонстрации" hidden></select></label>
        <button id="cart-button" class="cart-button" type="button" hidden aria-label="Корзина">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.6 12h10.9l2.5-8H6.3M9 20h.01M17 20h.01"/></svg>
          <span class="cart-label">Корзина</span><b id="cart-count">0</b>
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    <p id="notice" class="notice" role="status" hidden></p>

    <section id="catalog" aria-label="Ассортимент">
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="search" type="search" placeholder="Артикул, название или штрихкод" aria-label="Поиск товара" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
          <button type="button" id="search-clear" class="search-clear" aria-label="Очистить поиск" hidden>×</button>
          <kbd aria-hidden="true">/</kbd>
          <button type="button" id="scan-button" class="scan-btn" aria-label="Сканировать штрихкод камерой" title="Сканировать штрихкод"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></button>
        </label>
        <button type="button" id="filter-button" class="filter-button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span>Фильтры</span><b id="filter-count" hidden>0</b>
        </button>
      </div>
      <div id="active-filters" class="active-filters" hidden></div>
      <div class="heading">
        <h2>Ассортимент <span id="result-count" aria-live="polite"></span></h2>
        <button id="bulk-add" class="primary small" type="button" hidden></button>
      </div>
      <div id="grid" class="grid" aria-busy="true"></div>
      <div id="pager" aria-hidden="true"></div>
    </section>

    <section id="orders" aria-label="Заявки" hidden>
      <div class="heading">
        <h2 id="orders-title">Заявки</h2>
        <button id="refresh-orders" class="secondary small" type="button">Обновить</button>
      </div>
      <div class="filters orders-filters">
        <div class="seg" id="order-status" role="group" aria-label="Статус заявки"></div>
        <label class="pick" id="order-store-pick" hidden><span class="sr">Магазин</span><select id="order-store"><option value="">Все магазины</option></select></label>
        <label class="search small-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="order-search" type="search" placeholder="Артикул или № документа" aria-label="Поиск по заявкам" autocomplete="off"></label>
      </div>
      <div id="order-list"></div>
    </section>
  </main>

  <dialog id="product-dialog" class="product-dialog" aria-labelledby="product-title"></dialog>
  <dialog id="filter-dialog" class="sheet-dialog" aria-labelledby="filter-title">
    <div class="sheet-head"><h2 id="filter-title">Фильтры</h2><button type="button" class="round" id="filter-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="filter-body" class="sheet-body"></div>
    <div class="sheet-foot"><button type="button" class="secondary" id="filter-reset">Сбросить</button><button type="button" class="primary" id="filter-apply">Показать</button></div>
  </dialog>
  <button type="button" id="cart-fab" class="cart-fab" hidden aria-label="Открыть корзину"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.6 12h10.9l2.5-8H6.3M9 20h.01M17 20h.01"/></svg>Корзина<b id="cart-fab-count">0</b></button>
  <dialog id="photo-dialog" aria-label="Фотография товара">
    <div class="viewer-bar"><span id="photo-title"></span><button class="close" id="photo-close" type="button" aria-label="Закрыть фото">×</button></div>
    <div class="viewer-frame"><img id="photo-full" alt=""></div>
  </dialog>
  <dialog id="cart-dialog" class="cart-dialog" aria-labelledby="cart-title"></dialog>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-text">
    <form method="dialog"><p id="confirm-text"></p><footer><button class="secondary" value="no">Отмена</button><button class="primary" value="yes" id="confirm-yes">Да</button></footer></form>
  </dialog>
  <dialog id="scan-dialog" class="scan-dialog" aria-labelledby="scan-title">
    <div class="modal-head">
      <div><h2 id="scan-title">Сканировать штрихкод</h2><div class="meta">Держите бирку горизонтально внутри рамки</div></div>
      <div class="head-actions">
        <button type="button" class="icon-btn" id="scan-torch" hidden aria-pressed="false" aria-label="Фонарик"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6l-1 6h3l-7 14 1-9H8z"/></svg></button>
        <button class="close" type="button" id="scan-close" aria-label="Закрыть">×</button>
      </div>
    </div>
    <div class="scan-view"><video id="scan-video" playsinline muted></video><div class="scan-frame" aria-hidden="true"><i></i></div></div>
    <p id="scan-status" class="scan-status" role="status"></p>
    <form id="scan-manual" class="scan-manual"><input id="scan-code" type="text" inputmode="numeric" autocomplete="off" placeholder="Или введите штрихкод / артикул" aria-label="Штрихкод или артикул вручную"><button class="primary" type="submit">Найти</button></form>
  </dialog>
  <div id="print-area" aria-hidden="true"></div>
  <p id="toast" class="toast" role="status" hidden></p>
</body>
</html>
